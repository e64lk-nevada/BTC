services:
  - type: web
    name: btc-signal-only
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLL_SECONDS
        value: 15
      - key: MIN_SCORE
        value: 0.72
